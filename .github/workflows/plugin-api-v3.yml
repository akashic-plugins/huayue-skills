name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 6c8f8acda54d3c893dd11f1818d83d0a1bb01a85
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .akashic-core/requirements.txt
            .akashic-core/requirements-dev.txt
      - name: Install pinned Core dependencies
        run: python -m pip install -r .akashic-core/requirements.txt -r .akashic-core/requirements-dev.txt
      - name: Verify pure v3 Skill receipts
        env:
          PYTHONPATH: .akashic-core
        run: python -m pytest -q tests/
      - name: Check v3 source types
        env:
          PYTHONPATH: .akashic-core
        run: pyright --level error plugin.py
      - name: Compile Python sources
        run: python -m compileall -q plugin.py tests
      - name: Check diff formatting
        run: git diff --check
